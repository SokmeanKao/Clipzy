spring:
  application:
    name: clipzy-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/clipzy}
    username: ${DB_USER:clipzy}
    password: ${DB_PASSWORD:clipzy}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

server:
  port: ${SERVER_PORT:8081}

# Clipzy application settings (local defaults match infra/docker-compose.yml)
clipzy:
  jwt:
    # Override in production via JWT_SECRET (min 32 bytes for HS256)
    secret: ${JWT_SECRET:clipzy-local-dev-jwt-secret-change-me-please-32bytes-minimum!!}
    access-token-minutes: 30
    refresh-token-days: 14
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:videos}
    region: ${S3_REGION:us-east-1}
    # Public playback base: {endpoint}/{bucket} — manifests served as path-style URLs
    public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9000/videos}
    # Browser-facing S3 origin for presigned PUTs (blank → derive from public-base-url)
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    # Presigned PUT lifetime for raw uploads
    presign-put-minutes: 60
  ffmpeg:
    # Executable name or absolute path if FFmpeg is not on PATH (Windows example: C:/ffmpeg/bin/ffmpeg.exe)
    path: ${FFMPEG_PATH:ffmpeg}
  transcode:
    poll-ms: 5000
    # Claim up to this many PENDING jobs per tick (also capped by free worker slots)
    batch-size: 10
    # 0 = auto max(1, cores/2); each ffmpeg job already uses -threads 0
    worker-pool-size: ${TRANSCODE_WORKER_POOL_SIZE:0}
    upload-concurrency: ${TRANSCODE_UPLOAD_CONCURRENCY:8}

logging:
  level:
    org.flywaydb: INFO
    org.springframework.security: INFO
    com.clipzy.worker: INFO
