# Full-stack local "prod" stack: Postgres + MinIO + backend + frontend
# Usage (from repo root):
#   docker compose -f infra/docker-compose.prod.yml up --build
#
# Dev-only infra remains in infra/docker-compose.yml (Postgres + MinIO).
# Host Postgres is published on 5433 (same as local/dev) to avoid clashing with
# other Postgres instances on 5432. Inside the compose network, use postgres:5432.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipzy
      POSTGRES_PASSWORD: clipzy
      POSTGRES_DB: clipzy
    ports:
      - "5433:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipzy -d clipzy"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/videos;
      mc anonymous set download local/videos;
      exit 0;
      "

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/clipzy
      DB_USER: clipzy
      DB_PASSWORD: clipzy
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: videos
      S3_REGION: us-east-1
      S3_PUBLIC_BASE_URL: http://localhost:9000/videos
      JWT_SECRET: clipzy-prod-compose-jwt-secret-change-me-in-real-deploy-32b-min!!
      CLIPZY_CORS_ORIGINS: http://localhost:3000
      FFMPEG_PATH: ffmpeg
      SERVER_PORT: "8081"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8081
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      # NEXT_PUBLIC_* is baked at build time; runtime env is for completeness
      NEXT_PUBLIC_API_URL: http://localhost:8081

volumes:
  postgres_prod_data:
  minio_prod_data:
