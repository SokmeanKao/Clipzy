# Clipzy — pull pre-built app images; nginx is the only host port (443)
#
#   git clone --depth 1 https://github.com/SokmeanKao/Clipzy.git
#   cd Clipzy
#   docker compose -f docker-compose.pull.yml pull
#   docker compose -f docker-compose.pull.yml up -d
#
# App:  https://localhost/en   (accept self-signed cert warning)
# API:  https://localhost/api/actuator/health
#
# Images: ghcr.io/sokmeankao/clipzy-backend / clipzy-frontend
# Tag:    CLIPZY_TAG=v1.0.0 docker compose -f docker-compose.pull.yml up -d
#
# If pull is unauthorized: make GHCR packages Public, or:
#   echo YOUR_GITHUB_TOKEN | docker login ghcr.io -u YOUR_GITHUB_USERNAME --password-stdin
#
# Replace TLS certs later: copy fullchain.pem + privkey.pem into the nginx_certs volume.

name: clipzy

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipzy
      POSTGRES_PASSWORD: clipzy
      POSTGRES_DB: clipzy
    volumes:
      - clipzy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipzy -d clipzy"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_SERVER_URL: https://localhost
    volumes:
      - clipzy_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/videos;
      mc anonymous set download local/videos;
      exit 0;
      "

  backend:
    image: ghcr.io/sokmeankao/clipzy-backend:${CLIPZY_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/clipzy
      DB_USER: clipzy
      DB_PASSWORD: clipzy
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: videos
      S3_REGION: us-east-1
      S3_PUBLIC_BASE_URL: https://localhost/videos
      S3_PUBLIC_ENDPOINT: https://localhost
      JWT_SECRET: ${JWT_SECRET:-clipzy-local-compose-jwt-secret-change-me-32bytes-min!!}
      CLIPZY_CORS_ORIGINS: https://localhost
      FFMPEG_PATH: ffmpeg
      SERVER_PORT: "8081"

  frontend:
    image: ghcr.io/sokmeankao/clipzy-frontend:${CLIPZY_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend

  nginx-certs-init:
    image: alpine:3.20
    volumes:
      - nginx_certs:/etc/nginx/certs
      - ./infra/nginx/docker-entrypoint.d/10-generate-certs.sh:/generate.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache openssl && sh /generate.sh"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      nginx-certs-init:
        condition: service_completed_successfully
      frontend:
        condition: service_started
      backend:
        condition: service_started
      minio:
        condition: service_healthy
    ports:
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs:ro

volumes:
  clipzy_postgres_data:
  clipzy_minio_data:
  nginx_certs:
